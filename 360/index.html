<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEG ANNA — 360 Spatial Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #f3eee4; }
        #viewer-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; overflow: hidden; }
        .pano-bg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; transition: background-image 0.5s ease; will-change: transform; }
        .ui-overlay { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        video.pano-bg { object-fit: cover; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- 360 Panoramic Background Container -->
    <div id="viewer-container">
        <div id="bg-layer" class="pano-bg" style="background-image: url('360.avif');"></div>
        <video id="bg-video" class="pano-bg hidden" autoplay loop muted playsinline src="360-SECRET.mp4"></video>
    </div>

    <!-- UI Overlay -->
    <div class="ui-overlay absolute inset-0 flex flex-col justify-between p-6">
        <header class="flex justify-between items-center bg-black/60 backdrop-blur-md p-4 rounded-xl border border-white/10 interactive">
            <h1 class="text-xl font-bold tracking-widest text-emerald-400">VEG ANNA <span class="text-xs text-stone-400 font-normal">| 360° SPATIAL ECOSYSTEM</span></h1>
            <div class="flex items-center gap-4">
                <button id="toggle-autorotate" class="bg-emerald-900/60 hover:bg-emerald-800 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition">AUTO-ROTATE: ON</button>
                <button id="toggle-antipop" class="bg-stone-900/80 hover:bg-stone-800 text-stone-300 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold transition">ANTI-POP: 360.AVIF</button>
                <a href="https://100mlcoolhotsauce.com" target="_blank" class="text-red-400 hover:text-red-300 text-xs font-bold tracking-wider">SPONSORED BY 100MLCOOLHOTSAUCE.COM ↗</a>
            </div>
        </header>

        <footer class="flex justify-between items-end interactive">
            <div class="bg-black/60 backdrop-blur-md p-3 rounded-xl border border-white/10 text-xs text-stone-300">
                BEARING: <span id="bearing-val" class="text-emerald-400 font-mono">0° N</span>
            </div>
            <div class="bg-black/60 backdrop-blur-md p-3 rounded-xl border border-white/10 text-xs text-stone-400">
                Use <span class="text-emerald-400 font-bold">Arrow Keys</span> or drag to pan.
            </div>
        </footer>
    </div>

    <!-- Script Engine -->
    <script>
        const bgLayer = document.getElementById('bg-layer');
        const bgVideo = document.getElementById('bg-video');
        const autorotateBtn = document.getElementById('toggle-autorotate');
        const antipopBtn = document.getElementById('toggle-antipop');
        const bearingVal = document.getElementById('bearing-val');

        let currentLon = 0;
        let currentLat = 0;
        let isAutoRotate = true;
        let antiPopMode = 0; // 0: 360.avif, 1: 360.png, 2: 360-SECRET.mp4
        let isDragging = false;
        let startX = 0, startY = 0;

        // Auto-Rotate Loop
        function updateView() {
            if (isAutoRotate && !isDragging) {
                currentLon += 0.05;
                if (currentLon >= 360) currentLon = 0;
                if (currentLon < 0) currentLon += 360;
            }
            
            // Apply transform for smooth panoramic panning
            const container = document.getElementById('viewer-container');
            container.style.backgroundPosition = `${currentLon * 10}% ${50 + currentLat}%`;
            if(bgLayer.style.backgroundImage) {
                bgLayer.style.transform = `scale(1.1) translate(${-currentLon * 2}px, ${-currentLat * 2}px)`;
            }
            bgVideo.style.transform = `scale(1.1) translate(${-currentLon * 2}px, ${-currentLat * 2}px)`;

            bearingVal.textContent = `${Math.floor(currentLon)}° N`;
            requestAnimationFrame(updateView);
        }
        requestAnimationFrame(updateView);

        // Keyboard Arrow Keys
        window.addEventListener('keydown', (e) => {
            const step = 3;
            if (e.key === 'ArrowLeft' || e.key === 'a') currentLon -= step;
            if (e.key === 'ArrowRight' || e.key === 'd') currentLon += step;
            if (e.key === 'ArrowUp' || e.key === 'w') currentLat = Math.min(40, currentLat + step);
            if (e.key === 'ArrowDown' || e.key === 's') currentLat = Math.max(-40, currentLat - step);
        });

        // Mouse Drag Panning
        window.addEventListener('mousedown', (e) => {
            if(e.target.closest('header') || e.target.closest('footer')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            currentLon -= deltaX * 0.1;
            currentLat = Math.max(-40, Math.min(40, currentLat + deltaY * 0.1));
            startX = e.clientX;
            startY = e.clientY;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // Auto-Rotate Toggle
        autorotateBtn.addEventListener('click', () => {
            isAutoRotate = !isAutoRotate;
            autorotateBtn.textContent = `AUTO-ROTATE: ${isAutoRotate ? 'ON' : 'OFF'}`;
            autorotateBtn.className = isAutoRotate 
                ? "bg-emerald-900/60 hover:bg-emerald-800 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition"
                : "bg-stone-900/80 hover:bg-stone-800 text-stone-400 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold transition";
        });

        // Anti-Pop Mode Switcher Toggle
        antipopBtn.addEventListener('click', () => {
            antiPopMode = (antiPopMode + 1) % 3;
            if (antiPopMode === 0) {
                bgVideo.classList.add('hidden');
                bgVideo.pause();
                bgLayer.classList.remove('hidden');
                bgLayer.style.backgroundImage = "url('360.avif')";
                antipopBtn.textContent = "ANTI-POP: 360.AVIF";
            } else if (antiPopMode === 1) {
                bgVideo.classList.add('hidden');
                bgVideo.pause();
                bgLayer.classList.remove('hidden');
                bgLayer.style.backgroundImage = "url('360.png')";
                antipopBtn.textContent = "ANTI-POP: 360.PNG";
            } else if (antiPopMode === 2) {
                bgLayer.classList.add('hidden');
                bgVideo.classList.remove('hidden');
                bgVideo.play().catch(err => console.log("Video autoplay restricted"));
                antipopBtn.textContent = "ANTI-POP: SECRET.MP4";
            }
        });
    </script>
</body>
</html>
